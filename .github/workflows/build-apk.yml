name: Sukurti APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Atsisiųsti kodą
        uses: actions/checkout@v4

      - name: Paruošti Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Priimti Android SDK licencijas
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes 2>/dev/null | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Paruošti Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Kompiliuoti APK
        run: gradle assembleDebug

      - name: Įkelti paruoštą APK failą
        uses: actions/upload-artifact@v4
        with:
          name: permatomas-laikrodis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
